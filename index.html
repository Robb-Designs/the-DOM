<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./script.js"></script>
</head>

<body>
    <main>
        <section>
            <div class="sectionContainer">
                <form id="postForm">
                    <h2>Upload a post</h2>

                    <label for="title">Title</label>
                    <input id="title" name="title" type="text" placeholder="Post title">
                    <span class="errorMessage" id="titleError"></span>

                    <label for="content">Content</label>
                    <textarea name="content" id="content" placeholder="Enter your comments..."></textarea>
                    <span class="errorMessage" id="contentError"></span>

                    <button type="submit" role="button" id="submitBtn">Post</button>
                </form>

            </div>
        </section>

        <section id="blogPostDisplay"></section>
    </main>


</body>

</html>
