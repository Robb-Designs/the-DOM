<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./script.js"></script>
</head>

<body class="min-h-screen bg-base-300 p-6">
    <main>
        <section>
            <div class="sectionContainer">

                <form id="postForm" class="card bg-base-200 shadow-lg p-6 space-y-4">
                    <h2 class="text-2xl font-bold text-center">Upload a post</h2>
                    <div>
                        <label for="title" class="label">Title</label>
                        <input id="title" name="title" type="text" placeholder="Post title" minlength="5"
                            maxlength="50" class="input input-bordered w-full">
                        <span class="errorMessage text-error text-sm " id="titleError"></span>
                    </div>

                    <div>
                        <label for="content" class="label">Content</label>
                        <textarea name="content" id="content" placeholder="Enter your comments..." maxlength="500"
                            class="textarea textarea-bordered w-full"></textarea>
                        <span class="errorMessage" id="contentError"></span>
                    </div>

                    <button type="submit" role="button" id="submitBtn" class="btn btn-primary">Post</button>
                </form>

            </div>
        </section>

        <section id="blogPostDisplay" class="space-y-4"></section>
    </main>


</body>

</html>
